# Configuração do banco H2 para testes
spring.datasource.url=jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE;MODE=MySQL
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# JPA/Hibernate para testes
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.use_sql_comments=true

# Desabilitar cache durante testes
spring.cache.type=none

# Configurações específicas para testes
spring.test.database.replace=none
spring.jpa.defer-datasource-initialization=false

# Configuração de logging para testes
logging.level.org.springframework.web=INFO
logging.level.org.hibernate.SQL=WARN
logging.level.org.hibernate.type.descriptor.sql.BasicBinder=WARN
logging.level.org.hibernate=WARN
logging.level.com.delivery_api=DEBUG
logging.level.root=WARN

# Desabilitar inicialização de dados SQL durante testes
spring.sql.init.mode=never
spring.sql.init.data-locations=

# H2 Console (opcional para debug)
spring.h2.console.enabled=false
spring.h2.console.path=/h2-console

# Porta do servidor de testes
server.port=0

# Desabilitar segurança durante testes (se necessário)
spring.autoconfigure.exclude=org.springframework.boot.autoconfigure.security.servlet.SecurityAutoConfiguration

